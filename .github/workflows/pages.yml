name: Deploy research notes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install MyST Markdown
        run: npm install --global mystmd

      - name: Build website
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_build/html

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
