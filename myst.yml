version: 1

project:
  title: Effect Semantics Research Notes
  description: >-
    Living research notes on when an existing effectful language can be
    extended with user-defined operations and handlers while preserving its
    semantics and metatheory.
  keywords:
    - algebraic effects
    - effect handlers
    - deep handlers
    - conservative extension
    - graded monads
    - operational semantics
    - denotational semantics
    - logical relations
